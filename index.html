<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css">
    <title>DoToMYList!!!</title>
    </head>
    <body>
        <section class="todo">
            <h2>Do Something To My List Please!</h2>
            <div class="input">
                <input type="text" class="input-field" id="todoInput" placeholder="Wanna Do Something?"/>
            </div>
            <ul class="scroll">
                <li id="todoList"></li>
            </ul>
            <div>
                <hr class="counter"/>
                <div class="counter-container"></div>
                <p><Span>0</Span> Items Total</p>
                <button id="deleteButton">Delete All</button>
            </div>
            <button class="btn">Beat It!</button>
        </section>
        <footer>
            <div class="footer">
                <p class="made-by">Made By</p>
                <p class="author"><a href="https://adn4n.xyz/" target="_blank">Charizard!</a></p>
            </div>
        </footer>
    </body>
</html>
